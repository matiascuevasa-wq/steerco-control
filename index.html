/* ---------------- IMPORT HITOS FROM EXCEL / CSV ---------------- */
const XLSX_LIB_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';

function loadXlsxLib(){
  return new Promise((resolve, reject)=>{
    if(window.XLSX){ resolve(); return; }
    const s = document.createElement('script');
    s.src = XLSX_LIB_URL;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('No se pudo cargar la librería de importación'));
    document.head.appendChild(s);
  });
}

function parseFlexibleDate(v){
  if(v == null || v === '') return null;
  if(v instanceof Date && !isNaN(v)){
    return v.toISOString().slice(0,10);
  }
  if(typeof v === 'number'){
    // Excel serial date
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})$/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = '20'+y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return null;
}

function findCol(row, patterns){
  const keys = Object.keys(row);
  for(const p of patterns){
    const found = keys.find(k => p.test(k));
    if(found) return found;
  }
  return null;
}

async function importHitosFromFile(file){
  await loadXlsxLib();
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array', cellDates:true});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = window.XLSX.utils.sheet_to_json(sheet, {defval:''});
  const result = [];
  for(const row of rows){
    const colNombre = findCol(row, [/^actividad$/i, /^hito$/i, /^nombre$/i, /^tarea$/i]);
    const colInicio = findCol(row, [/inicio/i, /desde/i, /start/i, /^fecha ?inicio$/i]);
    const colFin = findCol(row, [/^fin$/i, /t[ée]rmino/i, /hasta/i, /^end$/i]);
    const nombre = colNombre ? String(row[colNombre]).trim() : '';
    if(!nombre) continue;
    const inicio = colInicio ? parseFlexibleDate(row[colInicio]) : null;
    const fin = colFin ? parseFlexibleDate(row[colFin]) : null;
    if(!inicio || !fin) continue;
    result.push({ id: uid('h'), nombre, inicio, fin });
  }
  return result;
}

/* ---------------- EXPORT PPTX ---------------- */
const PPTX_LIB_URL = 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
const PC = { verde:'1F8A4C', verdeTint:'E5F5EB', ambar:'B87A12', ambarTint:'FCF1DE', rojo:'C23B34', rojoTint:'FBE9E7', ink:'1B2430', soft:'5B6472', faint:'8992A0', line:'E1E4E9', bg:'F3F4F6', white:'FFFFFF' };
const PPTX_THEMES = {
  marino:   { label:'Marino',   hex:'1F3A5F' },
  esmeralda:{ label:'Esmeralda',hex:'15603F' },
  grafito:  { label:'Grafito',  hex:'33414F' },
  burdeos:  { label:'Burdeos',  hex:'7A2333' }
};

function loadPptxLib(){
  return new Promise((resolve, reject)=>{
    if(window.PptxGenJS){ resolve(); return; }
    const s = document.createElement('script');
    s.src = PPTX_LIB_URL;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('No se pudo cargar la librería de exportación'));
    document.head.appendChild(s);
  });
}

function semLabel(color){ return color==='verde' ? 'Verde' : color==='ambar' ? 'Amarillo' : 'Rojo'; }
function semHex(color){ return color==='verde' ? PC.verde : color==='ambar' ? PC.ambar : PC.rojo; }

function openExportModal(){
  const count = filteredProjects().length;
  const body = `
    <div class="small-note" style="margin-top:0;margin-bottom:14px;">Se exportarán ${count} proyecto(s), los mismos que ves filtrados ahora mismo en el listado.</div>
    <div class="field" style="margin-bottom:12px;">
      <label>Título del informe</label>
      <input type="text" id="ex-titulo" value="Estatus General de Proyectos">
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label>Subtítulo</label>
      <input type="text" id="ex-subtitulo" value="Gerencia de Proyectos y Suministros de Agua">
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label>Tema de color</label>
      <select id="ex-tema">
        ${Object.entries(PPTX_THEMES).map(([k,t])=>`<option value="${k}">${t.label}</option>`).join('')}
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:4px;">
      <input type="checkbox" id="ex-portada" checked style="width:auto;"> Incluir lámina de portada
    </label>
    <div class="modal-foot" style="padding:18px 0 0;border-top:none;">
      <button class="btn" type="button" id="ex-cancel">Cancelar</button>
      <button class="btn primary" type="button" id="ex-generar">Generar presentación</button>
    </div>
  `;
  const ov = openModalShell('Exportar a PowerPoint', body, (ov)=>{
    ov.querySelector('#ex-cancel').onclick = () => ov.remove();
    ov.querySelector('#ex-generar').onclick = async () => {
      const btn = ov.querySelector('#ex-generar');
      const options = {
        titulo: ov.querySelector('#ex-titulo').value.trim() || 'Control de proyectos',
        subtitulo: ov.querySelector('#ex-subtitulo').value.trim(),
        tema: ov.querySelector('#ex-tema').value,
        portada: ov.querySelector('#ex-portada').checked
      };
      await exportToPPTX(options, btn);
      ov.remove();
    };
  });
}

async function exportToPPTX(options, btnEl){
  const original = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = 'Generando…'; btnEl.disabled = true; }
  try{
    await loadPptxLib();
    const projects = filteredProjects();
    if(!projects.length){ alert('No hay proyectos que coincidan con los filtros actuales para exportar.'); return; }

    const accent = (PPTX_THEMES[options.tema] || PPTX_THEMES.marino).hex;
    const titulo = options.titulo || 'Control de proyectos';
    const subtitulo = options.subtitulo || '';

    const pptx = new window.PptxGenJS();
    pptx.defineLayout({ name:'WIDE', width:13.33, height:7.5 });
    pptx.layout = 'WIDE';

    /* Slide de portada */
    if(options.portada){
      let cover = pptx.addSlide();
      cover.background = { color: PC.white };
      cover.addShape('rect', { x:0, y:0, w:13.33, h:0.12, fill:{color:accent} });
      cover.addShape('rect', { x:0, y:2.7, w:1.1, h:0.06, fill:{color:accent} });
      cover.addText(titulo, { x:0.6, y:2.85, w:12, h:0.9, fontSize:34, bold:true, color:PC.ink, fontFace:'Arial' });
      if(subtitulo) cover.addText(subtitulo, { x:0.6, y:3.7, w:12, h:0.5, fontSize:16, color:PC.soft, fontFace:'Arial' });
      cover.addText(`Generado el ${fmtDate(todayISO())}  ·  ${projects.length} proyecto(s) incluidos`, { x:0.6, y:4.2, w:12, h:0.4, fontSize:11.5, color:PC.faint, fontFace:'Arial' });
    }

    /* Slide(s) de listado */
    const perSlide = 12;
    const totalChunks = Math.ceil(projects.length / perSlide);
    for(let c=0; c<totalChunks; c++){
      const chunk = projects.slice(c*perSlide, c*perSlide+perSlide);
      const sl = pptx.addSlide();
      addHeaderBand(sl, accent, 'Listado de proyectos' + (totalChunks>1 ? `  ·  parte ${c+1} de ${totalChunks}` : ''));

      const headerOpts = { bold:true, color:PC.white, fill:{color:accent}, fontSize:9.5, fontFace:'Arial', valign:'middle' };
      const rows = [[
        {text:'N°', options:headerOpts}, {text:'Proyecto', options:headerOpts}, {text:'Área', options:headerOpts}, {text:'Responsable', options:headerOpts},
        {text:'Requerim.', options:headerOpts}, {text:'Término', options:headerOpts}, {text:'Avance', options:headerOpts},
        {text:'Brecha', options:headerOpts}, {text:'Est.', options:headerOpts}, {text:'Alerta', options:headerOpts}
      ]];
      chunk.forEach((p,ri)=>{
        const brecha = (p.avanceReal||0) - (p.avancePlan||0);
        const band = ri % 2 === 1 ? PC.bg : PC.white;
        rows.push([
          {text:p.numero!=null?String(p.numero):'—', options:{fontSize:9, fontFace:'Arial', color:PC.faint, fill:{color:band}}},
          {text:p.nombre, options:{fontSize:9.5, fontFace:'Arial', color:PC.ink, fill:{color:band}}},
          {text:p.area, options:{fontSize:9, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
          {text:p.responsable||'—', options:{fontSize:9, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
          {text:fmtDate(p.fechaRequerimiento), options:{fontSize:8.5, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
          {text:fmtDate(p.fechaTermino), options:{fontSize:8.5, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
          {text:`${p.avanceReal||0}% / ${p.avancePlan||0}%`, options:{fontSize:9, fontFace:'Arial', color:PC.ink, fill:{color:band}}},
          {text:fmtBrecha(brecha), options:{fontSize:9, fontFace:'Arial', color: brecha>=0?PC.verde:PC.rojo, bold:true, fill:{color:band}}},
          {text:'●', options:{fontSize:15, align:'center', color:semHex(semaforo(p)), bold:true, fill:{color:band}}},
          {text:'●', options:{fontSize:15, align:'center', color:semHex(alertaColor(p)), bold:true, fill:{color:band}}}
        ]);
      });
      sl.addTable(rows, {
        x:0.45, y:1.15, w:12.45,
        colW:[0.4,2.85,1.2,1.4,1.0,1.0,1.1,0.8,0.65,0.65],
        border:{type:'solid', color:PC.line, pt:0.5},
        autoPage:false, rowH:0.36, valign:'middle'
      });
      sl.addText('Columna "Est." = semáforo de avance según brecha real vs plan  ·  "Alerta" = definida por el dueño del proyecto para relevar en reunión', { x:0.45, y:1.15+0.36*(rows.length)+0.12, w:12.45, h:0.3, fontSize:8.5, italic:true, color:PC.faint, fontFace:'Arial' });
      addFooter(sl, accent, titulo);
    }

    /* Una lámina por proyecto */
    projects.forEach(p => addProjectSlide(pptx, p, accent, titulo));

    await pptx.writeFile({ fileName: (titulo || 'control-proyectos').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.pptx' });
  }catch(err){
    console.error(err);
    alert('No se pudo generar la presentación. Verifica tu conexión e inténtalo de nuevo.');
  }finally{
    if(btnEl){ btnEl.textContent = original; btnEl.disabled = false; }
  }
}

function addHeaderBand(sl, accent, title){
  sl.addShape('rect', { x:0, y:0, w:13.33, h:0.82, fill:{color:accent} });
  sl.addText(title, { x:0.45, y:0.12, w:12.4, h:0.58, fontSize:19, bold:true, color:PC.white, fontFace:'Arial', valign:'middle' });
}

function addFooter(sl, accent, titulo){
  sl.addShape('rect', { x:0, y:7.28, w:13.33, h:0.02, fill:{color:PC.line} });
  sl.addText(titulo, { x:0.45, y:7.32, w:8, h:0.25, fontSize:8, color:PC.faint, fontFace:'Arial' });
  sl.addText(fmtDate(todayISO()), { x:10.5, y:7.32, w:2.4, h:0.25, fontSize:8, color:PC.faint, fontFace:'Arial', align:'right' });
}

function addStatusChip(sl, x, y, w, label, color){
  sl.addShape('roundRect', { x, y, w, h:0.34, fill:{color}, rectRadius:0.06, line:{type:'none'} });
  sl.addText(label, { x, y, w, h:0.34, fontSize:10.5, bold:true, color:PC.white, align:'center', valign:'middle', fontFace:'Arial' });
}

function addCardBox(sl, x, y, w, h, title, accent, extraHeaderText){
  sl.addShape('roundRect', { x, y, w, h, fill:{color:PC.white}, line:{color:PC.line, width:0.75}, rectRadius:0.05 });
  sl.addText(title, { x:x+0.15, y:y+0.08, w:w-1.1, h:0.24, fontSize:9.5, bold:true, color:accent, fontFace:'Arial' });
  if(extraHeaderText){
    sl.addText(extraHeaderText, { x:x+w-1.0, y:y+0.08, w:0.9, h:0.24, fontSize:7.5, color:PC.faint, fontFace:'Arial', align:'right' });
  }
  sl.addShape('line', { x:x+0.15, y:y+0.34, w:w-0.3, h:0, line:{color:PC.line, width:0.5} });
  return { x:x+0.18, y:y+0.42, w:w-0.36, h:h-0.55 };
}

function addBulletBox(sl, box, items, emptyText){
  if(!items.length){
    sl.addText(emptyText, { x:box.x, y:box.y, w:box.w, h:0.2, fontSize:8, italic:true, color:PC.faint, fontFace:'Arial' });
    return;
  }
  sl.addText(items.map(t => ({ text:t.text, options:{ bullet:{code:'25CF'}, fontSize:8, color:t.color||PC.ink, fontFace:'Arial', breakLine:true } })), { x:box.x, y:box.y, w:box.w, h:box.h, valign:'top' });
}

function addGanttVisual(sl, p, x, y, w, h, accent){
  sl.addText('CARTA GANTT (PLAN)', { x, y, w, h:0.22, fontSize:10, bold:true, color:accent, fontFace:'Arial', charSpacing:1 });
  const chartY = y + 0.28;
  const chartH = h - 0.28;
  const axisH = 0.16, rowGap = 0.04;
  const rowsH = Math.max(0.14, chartH - axisH - rowGap);
  const allHitos = p.hitos||[];
  if(!allHitos.length){
    sl.addText('Sin hitos cargados.', { x, y:chartY, w, h:0.3, fontSize:9, italic:true, color:PC.faint, fontFace:'Arial' });
    return;
  }
  /* Nunca dejamos que las filas se salgan de la altura asignada: si hay muchos hitos,
     se muestran menos (con una nota de "+N adicionales") en vez de desbordar la lámina. */
  const maxRows = Math.max(1, Math.min(9, Math.floor(rowsH / 0.14)));
  const hitos = allHitos.slice(0, maxRows);
  const rowH = rowsH / hitos.length;

  let minD=null, maxD=null;
  hitos.forEach(hh=>{
    if(!minD||hh.inicio<minD) minD=hh.inicio;
    if(!maxD||hh.fin>maxD) maxD=hh.fin;
  });
  const totalDays = Math.max(1, daysBetween(minD,maxD));
  const labelW = w*0.30;
  const trackX = x + labelW + 0.1;
  const trackW = w - labelW - 0.1;

  const {ticks} = buildTimeTicks(minD, maxD);
  ticks.forEach(t=>{
    const off = Math.max(0, Math.min(1, daysBetween(minD, t.date)/totalDays));
    sl.addText(t.label, { x: trackX + trackW*off - 0.35, y: chartY, w:0.7, h:axisH, fontSize:6.5, color:PC.faint, align:'center', fontFace:'Arial' });
  });
  sl.addShape('line', { x:trackX, y:chartY+axisH, w:trackW, h:0, line:{color:PC.line, width:0.5} });

  const barsY = chartY + axisH + rowGap;
  const fontSz = rowH < 0.19 ? 6 : 7;
  hitos.forEach((hh,i)=>{
    const ry = barsY + i*rowH;
    const label = hh.nombre.length > 46 ? hh.nombre.slice(0,44)+'…' : hh.nombre;
    sl.addText(label, { x, y:ry, w:labelW, h:rowH, fontSize:fontSz, color:PC.ink, fontFace:'Arial', valign:'middle', wrap:false });
    const off = Math.max(0, daysBetween(minD, hh.inicio)/totalDays);
    const dur = Math.max(0.012, daysBetween(hh.inicio, hh.fin)/totalDays);
    sl.addShape('roundRect', {
      x: trackX + trackW*off, y: ry+rowH*0.22, w: Math.max(0.06, trackW*Math.min(dur, 1-off)), h: rowH*0.56,
      fill:{color:'AEB9CC'}, line:{color:'8E9CB5', width:0.5}, rectRadius:0.015
    });
  });
  if(allHitos.length > hitos.length){
    sl.addText(`+ ${allHitos.length-hitos.length} actividad(es) adicionales — ver detalle en la app`, { x, y: barsY + hitos.length*rowH - 0.02, w, h:0.14, fontSize:6, italic:true, color:PC.faint, fontFace:'Arial' });
  }
}

function addProjectSlide(pptx, p, accent, titulo){
  const sl = pptx.addSlide();
  const sem = semaforo(p), al = alertaColor(p);
  const brecha = (p.avanceReal||0) - (p.avancePlan||0);

  sl.addShape('rect', { x:0, y:0, w:13.33, h:1.05, fill:{color:accent} });
  sl.addText((p.numero!=null?'N°'+p.numero+' — ':'')+p.nombre, { x:0.45, y:0.14, w:9.7, h:0.55, fontSize:20, bold:true, color:PC.white, fontFace:'Arial' });
  sl.addText(`${p.responsable||'sin responsable'}  ·  Etapa: ${p.etapa||'—'}  ·  ${p.estado==='activo'?'Activo':'Archivado'}`, { x:0.45, y:0.66, w:9.7, h:0.3, fontSize:10.5, color:'D7DEE8', fontFace:'Arial' });

  addStatusChip(sl, 10.35, 0.2, 2.55, `AVANCE ${semLabel(sem).toUpperCase()}`, semHex(sem));
  addStatusChip(sl, 10.35, 0.6, 2.55, `ALERTA ${semLabel(al).toUpperCase()}`, semHex(al));

  sl.addText([
    { text:'Avance real: ', options:{bold:true, color:PC.soft} },
    { text:`${p.avanceReal||0}%    `, options:{color:PC.ink, bold:true} },
    { text:'Avance plan: ', options:{bold:true, color:PC.soft} },
    { text:`${p.avancePlan||0}%    `, options:{color:PC.ink} },
    { text:'Brecha: ', options:{bold:true, color:PC.soft} },
    { text:fmtBrecha(brecha), options:{color: brecha>=0?PC.verde:PC.rojo, bold:true} }
  ], { x:0.45, y:1.1, w:9.7, h:0.24, fontSize:10, fontFace:'Arial' });

  sl.addText([
    { text:'Inicio: ', options:{bold:true, color:PC.soft} },
    { text:fmtDate(p.fechaInicio)+'   ', options:{color:PC.ink} },
    { text:'Térm. proyectado: ', options:{bold:true, color:PC.soft} },
    { text:fmtDate(p.fechaTermino)+'   ', options:{color:PC.ink} },
    { text:'Térm. requerido: ', options:{bold:true, color:PC.soft} },
    { text:fmtDate(p.fechaRequerimiento), options:{color:PC.ink} }
  ], { x:0.45, y:1.34, w:12.45, h:0.22, fontSize:8.5, fontFace:'Arial' });

  let y = 1.58;
  if(al !== 'verde' && p.alerta && p.alerta.comentario){
    sl.addShape('roundRect', { x:0.45, y, w:12.45, h:0.42, fill:{color: al==='rojo' ? PC.rojoTint : PC.ambarTint}, rectRadius:0.04, line:{color:semHex(al), width:0.75} });
    sl.addText(p.alerta.comentario, { x:0.62, y:y+0.02, w:12.12, h:0.38, fontSize:8.5, color:PC.ink, fontFace:'Arial', valign:'middle' });
    y += 0.5;
  } else {
    y += 0.08;
  }

  const row3H = 1.55, row2H = 1.3, rowGapV = 0.15, footerMargin = 0.35;
  const gap = 0.2;

  /* La Gantt nunca debe empujar el resto fuera de la lámina: si el banner de alerta
     corrió todo hacia abajo, le damos menos alto a la Gantt para que todo siga cabiendo. */
  const ganttY = y;
  const maxGanttH = 7.5 - footerMargin - row2H - rowGapV - row3H - rowGapV - ganttY;
  const ganttH = Math.max(1.0, Math.min(2.35, maxGanttH));
  addGanttVisual(sl, p, 0.45, ganttY, 12.45, ganttH, accent);

  const row3Y = ganttY + ganttH + rowGapV;
  const col1 = { x:0.45, w:4.15 }, col2 = { x:0.45+4.15+gap, w:4.15 }, col3 = { x:0.45+4.15+gap+4.15+gap, w:3.75 };

  let box = addCardBox(sl, col1.x, row3Y, col1.w, row3H, 'HIGHLIGHTS', accent);
  addBulletBox(sl, box, (p.highlights||[]).slice(0,4).map(x=>({text:x.descripcion, color:PC.ink})), 'Sin highlights registrados.');

  box = addCardBox(sl, col2.x, row3Y, col2.w, row3H, 'LOWLIGHTS', accent);
  addBulletBox(sl, box, (p.lowlights||[]).slice(0,4).map(x=>({text:x.descripcion, color:PC.rojo})), 'Sin lowlights registrados.');

  const pctEjec = p.presupuesto ? Math.min(100, Math.round((p.ejecutado||0)/p.presupuesto*100)) : 0;
  box = addCardBox(sl, col3.x, row3Y, col3.w, row3H, 'PRESUPUESTO', accent);
  sl.addShape('roundRect', { x:box.x, y:box.y+0.06, w:box.w, h:0.16, fill:{color:PC.bg}, rectRadius:0.08, line:{type:'none'} });
  if(pctEjec>0) sl.addShape('roundRect', { x:box.x, y:box.y+0.06, w:box.w*(pctEjec/100), h:0.16, fill:{color:accent}, rectRadius:0.08, line:{type:'none'} });
  sl.addText(`Ejecutado: ${fmtMoney(p.ejecutado)}  (${pctEjec}%)`, { x:box.x, y:box.y+0.3, w:box.w, h:0.22, fontSize:8.5, color:PC.ink, fontFace:'Arial' });
  sl.addText(`Presupuestado: ${fmtMoney(p.presupuesto)}`, { x:box.x, y:box.y+0.54, w:box.w, h:0.22, fontSize:8.5, color:PC.soft, fontFace:'Arial' });

  const row2Y = row3Y + row3H + rowGapV;
  const rcol1 = { x:0.45, w:(12.45-gap)/2 }, rcol2 = { x:0.45+(12.45-gap)/2+gap, w:(12.45-gap)/2 };

  box = addCardBox(sl, rcol1.x, row2Y, rcol1.w, row2H, 'PRINCIPALES RIESGOS', accent);
  addBulletBox(sl, box, (p.riesgos||[]).slice(0,4).map(r=>({text:`${r.descripcion}  (${r.nivel})`, color: r.nivel==='alto'?PC.rojo:r.nivel==='medio'?PC.ambar:PC.verde})), 'Sin riesgos registrados.');

  box = addCardBox(sl, rcol2.x, row2Y, rcol2.w, row2H, 'REQUERIMIENTOS DE APOYO', accent);
  addBulletBox(sl, box, (p.apoyos||[]).slice(0,4).map(a=>({text:a.descripcion, color:PC.ink})), 'Sin requerimientos registrados.');

  addFooter(sl, accent, titulo);
}

async function exportSingleProjectPPTX(p, btnEl){

  if(btnEl){ btnEl.textContent = 'Generando…'; btnEl.disabled = true; }

    alert('No se pudo generar la presentación. Verifica tu conexión e inténtalo de nuevo.');
  }finally{
    if(btnEl){ btnEl.textContent = original; btnEl.disabled = false; }
  }
}
