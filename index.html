<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de proyectos</title>
<style>
:root{
  --bg:#F3F4F6;
  --panel:#FFFFFF;
  --border:#E1E4E9;
  --border-strong:#C7CCD4;
  --ink:#1B2430;
  --ink-soft:#5B6472;
  --ink-faint:#8992A0;
  --navy:#1F3A5F;
  --navy-dark:#152840;
  --navy-tint:#E9EEF5;
  --verde:#1F8A4C;
  --verde-tint:#E5F5EB;
  --ambar:#B87A12;
  --ambar-tint:#FCF1DE;
  --rojo:#C23B34;
  --rojo-tint:#FBE9E7;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --disp: 'Space Grotesk', var(--sans);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
}
#app{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.topbar h1{font-family:var(--disp);font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em;}
.topbar .sub{color:var(--ink-soft);font-size:13px;}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:4px;}
.tab-btn{border:none;background:transparent;padding:8px 16px;border-radius:999px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.15s;}
.tab-btn.active{background:var(--navy);color:#fff;}
.tab-btn:not(.active):hover{background:var(--bg);}

/* ---------- kpi row ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.kpi .num{font-family:var(--disp);font-size:24px;font-weight:600;line-height:1;}
.kpi .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.kpi.v .num{color:var(--verde);}
.kpi.a .num{color:var(--ambar);}
.kpi.r .num{color:var(--rojo);}

/* ---------- executive summary bar ---------- */
.exec-summary{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 18px;margin-bottom:16px;flex-wrap:wrap;}
.es-block{display:flex;align-items:baseline;gap:6px;}
.es-total{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--navy);}
.es-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.es-div{width:1px;height:20px;background:var(--border);}
.exec-cluster{display:flex;align-items:center;gap:10px;}
.exec-cluster .es-title{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-right:2px;}
.exec-chip{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);}
.exec-chip .dot{width:8px;height:8px;}
.es-archived{margin-left:auto;font-size:11.5px;color:var(--ink-faint);}
@media(max-width:640px){.exec-summary{gap:10px;} .es-archived{margin-left:0;width:100%;}}

/* ---------- panel/card ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);}
.panel + .panel{margin-top:16px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
.panel-head h2{font-family:var(--disp);font-size:15px;font-weight:600;margin:0;}
.panel-body{padding:16px 18px;}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
select,input[type=text],input[type=date],input[type=number],textarea{
  font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--border-strong);border-radius:7px;
  padding:7px 10px;
}
select:focus,input:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:0px;border-color:var(--navy);}
.btn{
  font-family:var(--sans);font-size:13px;font-weight:600;
  border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--border-strong);
  background:#fff;color:var(--ink);transition:.12s;
}
.btn:hover{background:var(--bg);}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy-dark);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--bg);}
.btn.danger{color:var(--rojo);border-color:var(--rojo-tint);}
.btn.danger:hover{background:var(--rojo-tint);}
.btn.sm{padding:5px 10px;font-size:12px;}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px;}
tbody tr{cursor:pointer;transition:.1s;}
tbody tr:hover{background:var(--navy-tint);}
tbody tr:last-child td{border-bottom:none;}
.proj-name{font-weight:600;color:var(--ink);}
.proj-area{font-size:12px;color:var(--ink-soft);}
.mono{font-family:var(--mono);font-size:12.5px;}
.semaforo{display:inline-flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dot.verde{background:var(--verde);}
.dot.ambar{background:var(--ambar);}
.dot.rojo{background:var(--rojo);}
.brecha{font-family:var(--mono);font-weight:600;}
.brecha.pos{color:var(--verde);}
.brecha.neg{color:var(--rojo);}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;display:inline-block;}
.badge.activo{background:var(--navy-tint);color:var(--navy);}
.badge.archivado{background:var(--bg);color:var(--ink-faint);}
.progress-mini{width:70px;height:6px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative;}
.progress-mini > div{height:100%;background:var(--navy);}
.empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}

/* ---------- detail view ---------- */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.detail-header h2{font-family:var(--disp);font-size:20px;margin:0 0 4px;}
.detail-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink-soft);}
.detail-meta b{color:var(--ink);font-weight:600;}

/* meta chips - etiquetas de fácil lectura */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.mchip{display:flex;flex-direction:column;justify-content:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;min-width:96px;}
.mchip .mc-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;}
.mchip .mc-value{font-size:13px;font-weight:700;color:var(--ink);margin-top:1px;white-space:nowrap;}
.mchip.sem{flex-direction:row;align-items:center;gap:8px;}
.mchip.sem .dot{width:11px;height:11px;}
.mchip.verde{background:var(--verde-tint);border-color:transparent;}
.mchip.verde .mc-value{color:var(--verde);}
.mchip.ambar{background:var(--ambar-tint);border-color:transparent;}
.mchip.ambar .mc-value{color:var(--ambar);}
.mchip.rojo{background:var(--rojo-tint);border-color:transparent;}
.mchip.rojo .mc-value{color:var(--rojo);}
.mchip.qedit{cursor:pointer;transition:.12s;}
.mchip.qedit:hover{box-shadow:0 0 0 2px var(--navy) inset;}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
@media(max-width:860px){.grid2{grid-template-columns:1fr;} .kpi-row{grid-template-columns:repeat(2,1fr);}}

/* gantt */
.gantt-row{display:flex;align-items:center;gap:10px;padding:3px 0;border-bottom:1px solid var(--bg);}
.gantt-row:last-child{border-bottom:none;}
.gantt-row-editable{cursor:pointer;border-radius:5px;}
.gantt-row-editable:hover{background:var(--navy-tint);}
.gantt-label{width:230px;flex-shrink:0;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gantt-track{flex:1;height:13px;background:var(--bg);border-radius:4px;position:relative;min-width:400px;}
.gantt-bar{position:absolute;top:0;height:100%;border-radius:4px;background:#AEB9CC;border:1px solid #8E9CB5;}
.gantt-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy);z-index:2;}
.gantt-axis-row{padding:0 0 4px;border-bottom:none;}
.gantt-axis-track{height:16px;background:transparent;position:relative;min-width:400px;}
.gantt-axis-tick{position:absolute;bottom:0;font-size:9.5px;color:var(--ink-faint);border-left:1px solid var(--border);padding-left:3px;height:100%;display:flex;align-items:flex-end;white-space:nowrap;}
.gantt-wrap{overflow-x:auto;max-height:340px;overflow-y:auto;}

/* hitos list */
.hito-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg);font-size:13px;}
.hito-item:last-child{border-bottom:none;}
.hito-estado{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.hito-estado.pendiente{background:var(--border-strong);}
.hito-estado.en_curso{background:var(--ambar);}
.hito-estado.completado{background:var(--verde);}
.hito-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--border-strong);}
.hito-fecha{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft);}

/* risk / support */
.tag-item{padding:9px 0;border-bottom:1px solid var(--bg);font-size:13px;}
.tag-item:last-child{border-bottom:none;}
.nivel{font-size:10.5px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:8px;}
.nivel.alto{background:var(--rojo-tint);color:var(--rojo);}
.nivel.medio{background:var(--ambar-tint);color:var(--ambar);}
.nivel.bajo{background:var(--verde-tint);color:var(--verde);}

/* budget */
.budget-bar-track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin:8px 0 4px;}
.budget-bar-fill{height:100%;background:var(--navy);}
.budget-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);}
.budget-nums b{color:var(--ink);font-family:var(--mono);}

/* history log */
.log-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bg);font-size:12.5px;}
.log-item:last-child{border-bottom:none;}
.log-avatar{width:26px;height:26px;border-radius:50%;background:var(--navy-tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.log-meta{color:var(--ink-faint);font-size:11.5px;}

/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid.full{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.field select,.field input,.field textarea{width:100%;}
.subsection{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
.subsection-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
.repeat-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.repeat-row > *{flex:1;}
.repeat-row .btn{flex:0;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:calc(100vh - 80px);overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;}
.modal-head h3{font-family:var(--disp);font-size:16px;margin:0;}
.modal-body{padding:18px 20px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);}

/* update seguimiento */
.follow-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bg);}
.follow-row:last-child{border-bottom:none;}
.follow-name{font-weight:600;font-size:13px;width:150px;flex-shrink:0;}
.follow-projects{font-size:12px;color:var(--ink-soft);flex:1;}
.follow-days{font-family:var(--mono);font-size:12.5px;font-weight:600;width:110px;text-align:right;}

.hidden{display:none !important;}
.small-note{font-size:12px;color:var(--ink-faint);margin-top:10px;}
a.linklike{color:var(--navy);cursor:pointer;font-weight:600;}

/* timeline view */
.timeline-wrap{overflow-x:auto;position:relative;}
.timeline-axis-row{display:flex;align-items:flex-end;margin-bottom:8px;position:sticky;top:0;background:var(--panel);z-index:3;}
.timeline-row{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--bg);cursor:pointer;}
.timeline-row:hover .timeline-label{background:var(--navy-tint);}
.timeline-label{width:220px;flex-shrink:0;font-size:12px;padding-right:10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;position:sticky;left:0;background:var(--panel);z-index:1;}
.timeline-track{flex:1;height:20px;background:var(--bg);border-radius:4px;position:relative;min-width:900px;}
.timeline-axis{background:transparent;height:24px;}
.timeline-tick{position:absolute;bottom:0;font-size:10.5px;color:var(--ink-soft);font-weight:600;transform:translateX(2px);white-space:nowrap;border-left:1px solid var(--border);padding-left:4px;height:100%;display:flex;align-items:flex-end;}
.timeline-bar{position:absolute;top:2px;bottom:2px;border-radius:3px;cursor:default;}
.timeline-bar.verde{background:var(--verde);}
.timeline-bar.ambar{background:var(--ambar);}
.timeline-bar.rojo{background:var(--rojo);}
.timeline-today{position:absolute;top:0;bottom:0;width:2px;background:var(--navy);z-index:2;}

/* project photo */
.photo-upload-preview{width:130px;height:95px;object-fit:cover;border-radius:7px;border:1px solid var(--border-strong);}
.project-photo-thumb{width:150px;height:105px;object-fit:cover;border-radius:9px;border:1px solid var(--border);cursor:zoom-in;transition:.15s;flex-shrink:0;}
.project-photo-thumb:hover{opacity:.85;transform:scale(1.02);}
.photo-placeholder{width:150px;height:105px;border-radius:9px;border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;text-align:center;padding:8px;flex-shrink:0;}
.lightbox-overlay{position:fixed;inset:0;background:rgba(10,14,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:36px;cursor:zoom-out;}
.lightbox-overlay img{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 12px 44px rgba(0,0,0,.55);}
.lightbox-caption{color:#fff;font-size:13px;margin-top:12px;opacity:.85;}

/* login */
.login-wrap{max-width:420px;margin:60px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;}
.login-wrap h1{font-family:var(--disp);font-size:19px;margin:0 0 6px;}
.login-wrap p{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
.login-wrap .field{margin-bottom:14px;}
.login-note{font-size:11.5px;color:var(--ink-faint);margin-top:16px;line-height:1.5;}

/* user chip + sync */
.user-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;}
.user-chip .log-avatar{width:22px;height:22px;font-size:10px;}
.sync-row{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-faint);margin-top:8px;justify-content:flex-end;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--verde);display:inline-block;}
.readonly-note{font-size:12px;color:var(--ink-faint);background:var(--bg);border-radius:7px;padding:8px 12px;margin-top:4px;}

/* ---------- vista compacta (lámina) ---------- */
.slide-view{
  max-width:1280px;margin:0 auto;
  background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:14px 18px 18px;box-shadow:0 2px 14px rgba(20,25,35,.06);
  font-size:11px;
}
.slide-view .panel{border-radius:8px;}
.slide-view .panel + .panel{margin-top:8px;}
.slide-view .panel-head{padding:7px 12px;}
.slide-view .panel-head h2{font-size:12px;}
.slide-view .panel-body{padding:8px 12px;}
.slide-view h2{font-size:16px;margin:0 0 2px;}
.slide-view .chip-row{gap:6px;margin-top:6px;}
.slide-view .mchip{padding:4px 8px;min-width:64px;}
.slide-view .mchip .mc-label{font-size:8px;}
.slide-view .mchip .mc-value{font-size:10.5px;}
.slide-view .project-photo-thumb,
.slide-view .photo-placeholder{width:90px;height:64px;}
.slide-view .detail-header{gap:10px;}
.slide-view .gantt-wrap{max-height:150px;}
.slide-view .gantt-row{padding:1px 0;}
.slide-view .gantt-label{width:150px;font-size:9.5px;}
.slide-view .gantt-track{height:9px;min-width:260px;}
.slide-view .gantt-axis-track{height:12px;}
.slide-view .gantt-axis-tick{font-size:8.5px;}
.slide-view .grid2{grid-template-columns:1fr 1fr 1fr;gap:8px;}
.slide-view .tag-item{font-size:10px;padding:3px 0;}
.slide-view .hito-item{font-size:10px;padding:3px 0;}
.slide-view .repeat-row{margin-top:6px;gap:4px;}
.slide-view .repeat-row input,
.slide-view .repeat-row select{font-size:10px;padding:3px 6px;}
.slide-view .btn.sm{font-size:10px;padding:3px 7px;}
.slide-view .budget-bar-track{height:6px;}
.slide-view .budget-nums{font-size:10px;}
.slide-view .historial-panel{display:none;}
.slide-view .small-note{display:none;}
@media(max-width:900px){.slide-view .grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRWU0OhnZZwb7yJMHZRLbzHSAuqCXM91k",
  authDomain: "steerco-control.firebaseapp.com",
  projectId: "steerco-control",
  storageBucket: "steerco-control.firebasestorage.app",
  messagingSenderId: "822103930617",
  appId: "1:822103930617:web:9f2788c617f270f37a5428"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const FB_COLLECTION = 'steercoData';
const PROJECTS_COLLECTION = 'projects';

let fbReady = new Promise((resolve, reject) => {
  onAuthStateChanged(auth, (user) => { if(user) resolve(user); });
  signInAnonymously(auth).catch(reject);
});

async function fbGetDoc(id){
  await fbReady;
  const snap = await getDoc(doc(db, FB_COLLECTION, id));
  return snap.exists() ? snap.data() : null;
}
async function fbSetDoc(id, value){
  await fbReady;
  await setDoc(doc(db, FB_COLLECTION, id), { value: value, updatedAt: Date.now() });
}
function fbListen(id, callback){
  return onSnapshot(doc(db, FB_COLLECTION, id), (snap) => {
    if(snap.exists()) callback(snap.data());
  }, (err) => { console.error('Error de sincronización en vivo:', err); });
}

/* Cada proyecto vive en su propio documento (no todos juntos), para que una foto
   nunca pueda hacer que el conjunto supere el límite de 1MB por documento de Firestore. */
async function fbGetAllProjects(){
  await fbReady;
  const snap = await getDocs(collection(db, PROJECTS_COLLECTION));
  const out = [];
  snap.forEach(d => {
    const data = d.data();
    if(data && data.value){
      try{ out.push(JSON.parse(data.value)); }catch(e){}
    }
  });
  return out;
}
async function fbSaveProject(p){
  await fbReady;
  await setDoc(doc(db, PROJECTS_COLLECTION, p.id), { value: JSON.stringify(p), updatedAt: Date.now() });
}
async function fbDeleteAllProjects(){
  await fbReady;
  const snap = await getDocs(collection(db, PROJECTS_COLLECTION));
  for(const d of snap.docs){
    await deleteDoc(doc(db, PROJECTS_COLLECTION, d.id));
  }
}
function fbListenProjects(callback){
  return onSnapshot(collection(db, PROJECTS_COLLECTION), (snap) => {
    const out = [];
    snap.forEach(d => {
      const data = d.data();
      if(data && data.value){
        try{ out.push(JSON.parse(data.value)); }catch(e){}
      }
    });
    callback(out);
  }, (err) => { console.error('Error de sincronización en vivo:', err); });
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtBrecha(brecha){ const n = Number(brecha)||0; return (n>=0?'+':'') + n.toFixed(1) + '%'; }

function buildTimeTicks(minD, maxD){
  const totalDays = Math.max(1, daysBetween(minD, maxD));
  let granularity = totalDays <= 400 ? 'month' : totalDays <= 1500 ? 'quarter' : 'year';
  const ticks = [];
  const endD = new Date(maxD+'T00:00:00');
  let cursor;
  if(granularity === 'month'){
    cursor = new Date(minD+'T00:00:00'); cursor.setDate(1);
    while(cursor <= endD){
      ticks.push({date: cursor.toISOString().slice(0,10), label: cursor.toLocaleDateString('es-CL',{month:'short',year:'2-digit'})});
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    }
  } else if(granularity === 'quarter'){
    const d0 = new Date(minD+'T00:00:00');
    cursor = new Date(d0.getFullYear(), Math.floor(d0.getMonth()/3)*3, 1);
    while(cursor <= endD){
      const q = Math.floor(cursor.getMonth()/3)+1;
      ticks.push({date: cursor.toISOString().slice(0,10), label: `Q${q} ${cursor.getFullYear()}`});
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+3, 1);
    }
  } else {
    const d0 = new Date(minD+'T00:00:00');
    cursor = new Date(d0.getFullYear(), 0, 1);
    while(cursor <= endD){
      ticks.push({date: cursor.toISOString().slice(0,10), label: String(cursor.getFullYear())});
      cursor = new Date(cursor.getFullYear()+1, 0, 1);
    }
  }
  return {ticks, totalDays, granularity};
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadData(){
  try{
    const list = await fbGetAllProjects();
    if(list.length){
      STATE.projects = list;
    } else {
      STATE.projects = seedData();
      await saveData();
    }
  }catch(e){
    console.error('Error cargando proyectos:', e);
    STATE.projects = seedData();
    try{ await saveData(); }catch(e2){}
  }
  STATE.lastSync = Date.now();

  try{
    const d = await fbGetDoc(DIRECTORIO_KEY);
    STATE.directorio = d && d.value ? JSON.parse(d.value) : DIRECTORIO_SEED.slice();
    if(!d || !d.value){ await saveDirectorio(); }
  }catch(e){
    STATE.directorio = DIRECTORIO_SEED.slice();
    try{ await saveDirectorio(); }catch(e2){}
  }

  try{
    const a = await fbGetDoc(AREAS_KEY);
    STATE.areas = a && a.value ? JSON.parse(a.value) : AREAS_SEED.slice();
    if(!a || !a.value){ await saveAreas(); }
  }catch(e){
    STATE.areas = AREAS_SEED.slice();
    try{ await saveAreas(); }catch(e2){}
  }

  try{
    const s = await fbGetDoc(SESIONES_KEY);
    STATE.sesiones = s && s.value ? JSON.parse(s.value) : SESIONES_SEED.slice();
    if(!s || !s.value){ await saveSesiones(); }
  }catch(e){
    STATE.sesiones = SESIONES_SEED.slice();
    try{ await saveSesiones(); }catch(e2){}
  }

  try{
    const t = await fbGetDoc(TIPOS_KEY);
    STATE.tipos = t && t.value ? JSON.parse(t.value) : TIPOS_SEED.slice();
    if(!t || !t.value){ await saveTipos(); }
  }catch(e){
    STATE.tipos = TIPOS_SEED.slice();
    try{ await saveTipos(); }catch(e2){}
  }

  try{
    const k = await fbGetDoc(KPI_KEY);
    STATE.kpiDrivers = k && k.value ? JSON.parse(k.value) : KPI_SEED.slice();
    if(!k || !k.value){ await saveKpiDrivers(); }
  }catch(e){
    STATE.kpiDrivers = KPI_SEED.slice();
    try{ await saveKpiDrivers(); }catch(e2){}
  }

  try{
    const stored = JSON.parse(localStorage.getItem(USER_KEY) || 'null');
    STATE.currentUser = stored && STATE.directorio.find(d=>d.nombre===stored.nombre) ? stored : null;
  }catch(e){
    STATE.currentUser = null;
  }

  STATE.loading = false;
  render();
  startRealtimeSync();
}

async function saveData(){
  /* Guarda cada proyecto en su propio documento (no todos juntos), así una foto
     grande en un proyecto nunca puede romper el guardado de los demás. */
  try{
    for(const p of STATE.projects){
      await fbSaveProject(p);
    }
    STATE.lastSync = Date.now();
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function startRealtimeSync(){
  if(STATE.polling) return;
  STATE.polling = true;
  fbListenProjects((list) => {
    const current = JSON.stringify(STATE.projects);
    const incoming = JSON.stringify(list);
    if(incoming !== current){
      STATE.projects = list;
      STATE.lastSync = Date.now();
      render();
    }
  });
  fbListen(DIRECTORIO_KEY, (data) => {
    if(!data || !data.value) return;
    const incoming = data.value;
    if(incoming !== JSON.stringify(STATE.directorio)){
      STATE.directorio = JSON.parse(incoming);
      render();
    }
  });
  fbListen(AREAS_KEY, (data) => {
    if(!data || !data.value) return;
    const incoming = data.value;
    if(incoming !== JSON.stringify(STATE.areas)){
      STATE.areas = JSON.parse(incoming);
      render();
    }
  });
  fbListen(SESIONES_KEY, (data) => {
    if(!data || !data.value) return;
    const incoming = data.value;
    if(incoming !== JSON.stringify(STATE.sesiones)){
      STATE.sesiones = JSON.parse(incoming);
      render();
    }
  });
  fbListen(TIPOS_KEY, (data) => {
    if(!data || !data.value) return;
    const incoming = data.value;
    if(incoming !== JSON.stringify(STATE.tipos)){
      STATE.tipos = JSON.parse(incoming);
      render();
    }
  });
  fbListen(KPI_KEY, (data) => {
    if(!data || !data.value) return;
    const incoming = data.value;
    if(incoming !== JSON.stringify(STATE.kpiDrivers)){
      STATE.kpiDrivers = JSON.parse(incoming);
      render();
    }
  });
}

async function pollForUpdates(){
  try{
    const list = await fbGetAllProjects();
    const current = JSON.stringify(STATE.projects);
    const incoming = JSON.stringify(list);
    if(incoming !== current){
      STATE.projects = list;
    }
    STATE.lastSync = Date.now();
    render();
  }catch(e){
    console.error('No se pudo forzar la sincronización:', e);
  }
}

function timeAgo(ts){
  if(!ts) return '—';
  const s = Math.round((Date.now()-ts)/1000);
  if(s < 5) return 'ahora mismo';
  if(s < 60) return `hace ${s} s`;
  return `hace ${Math.round(s/60)} min`;
}

function isExcelencia(){
  return !!(STATE.currentUser && STATE.currentUser.rol === 'excelencia');
}
function canFullEdit(p){
  return isExcelencia();
}
function canUpdate(p){
  if(!STATE.currentUser) return false;
  return isExcelencia() || p.area === STATE.currentUser.area;
}
function canArchive(p){
  return isExcelencia();
}

async function doLogin(nombre, password){
  const entry = STATE.directorio.find(d => d.nombre === nombre);
  if(!entry) return;
  if(entry.rol === 'excelencia' && password !== EXCELENCIA_PASSWORD){
    STATE.loginError = 'Clave incorrecta para el perfil de Excelencia Operacional.';
    render();
    return;
  }
  STATE.loginError = '';
  STATE.currentUser = entry;
  try{ localStorage.setItem(USER_KEY, JSON.stringify(entry)); }catch(e){}
  render();
}

async function doLogout(){
  STATE.currentUser = null;
  STATE.loginSelected = '';
  STATE.loginError = '';
  try{ localStorage.removeItem(USER_KEY); }catch(e){}
  render();
}

function getProject(id){ return STATE.projects.find(p => p.id === id); }
function getNextNumero(){
  return STATE.projects.reduce((max,p)=> Math.max(max, p.numero||0), 0) + 1;
}

function semaforo(p){
  const brecha = (p.avanceReal||0) - (p.avancePlan||0);
  const vencido = p.fechaTermino && p.fechaTermino < todayISO() && (p.avanceReal||0) < 100;
  if(vencido) return 'rojo';
  if(brecha >= -5) return 'verde';
  if(brecha >= -15) return 'ambar';
  return 'rojo';
}
function alertaColor(p){
  return (p.alerta && p.alerta.color) || 'verde';
}

function render(){
  const app = document.getElementById('app');
  if(STATE.loading){ app.innerHTML = '<div class="empty">Cargando datos…</div>'; return; }
  if(!STATE.currentUser){ app.innerHTML = renderLogin(); attachHandlers(); return; }
  let body;
  if(STATE.view === 'list') body = renderListView();
  else if(STATE.view === 'seguimiento') body = renderSeguimientoView();
  else if(STATE.view === 'equipo') body = renderTeamView();
  else if(STATE.view === 'timeline') body = renderTimelineView();
  else body = renderDetailView();
  app.innerHTML = renderTopbar() + body;
  attachHandlers();
}

function filteredProjects(){
  return STATE.projects.filter(p => {
    if(STATE.filterEstado !== 'todos' && p.estado !== STATE.filterEstado) return false;
    if(STATE.filterArea !== 'todas' && p.area !== STATE.filterArea) return false;
    if(STATE.filterSemaforo !== 'todos' && semaforo(p) !== STATE.filterSemaforo) return false;
    if(STATE.filterAlerta !== 'todos' && alertaColor(p) !== STATE.filterAlerta) return false;
    return true;
  }).sort((a,b)=> (a.numero||0) - (b.numero||0));
}

function renderQuickList(p, listKey, opts){
  opts = opts || {};
  const items = p[listKey] || [];
  const editable = canUpdate(p);
  const itemsHtml = items.map((it,i)=>{
    const label = opts.nivel ? `<span class="nivel ${it.nivel}">${it.nivel}</span>${esc(it.descripcion)}` : esc(it.descripcion);
    return `<div class="tag-item" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span>${label}</span>
      ${editable ? `<button class="btn ghost sm" data-action="quick-del-item" data-list="${listKey}" data-id="${p.id}" data-idx="${i}" title="Quitar">✕</button>` : ''}
    </div>`;
  }).join('') || `<div class="empty">${opts.emptyText||'Sin registros.'}</div>`;

  const addRow = editable ? `
    <div class="repeat-row" style="margin-top:10px;">
      <input type="text" id="qadd-${listKey}" class="quick-add-input" data-add-btn="qaddbtn-${listKey}" placeholder="${esc(opts.placeholder||'Agregar...')}" style="flex:2;">
      ${opts.nivel ? `<select id="qadd-${listKey}-nivel"><option value="bajo">Bajo</option><option value="medio" selected>Medio</option><option value="alto">Alto</option></select>` : ''}
      <button class="btn sm primary" id="qaddbtn-${listKey}" data-action="quick-add-item" data-list="${listKey}" data-id="${p.id}">+ Agregar</button>
    </div>` : '';

  return itemsHtml + addRow;
}

function renderDetailView(){
  if(!STATE.selectedId || !getProject(STATE.selectedId)){
    const activos = STATE.projects.filter(p=>p.estado==='activo');
    if(!activos.length) return `<div class="panel"><div class="empty">No hay proyectos activos para mostrar en detalle.</div></div>`;
    STATE.selectedId = activos[0].id;
  }
  const p = getProject(STATE.selectedId);
  const sem = semaforo(p);
  const al = alertaColor(p);
  const alComentario = (p.alerta && p.alerta.comentario) || '';
  const brecha = (p.avanceReal||0) - (p.avancePlan||0);
  const otherProjects = STATE.projects.filter(x=>x.estado==='activo' || x.id===p.id);

  const range = ganttRange(p);
  const ganttEditable = canFullEdit(p);
  const ganttRows = (p.hitos||[]).map(h => renderGanttRow(h, range, p.id, ganttEditable)).join('') || `<div class="empty">Sin hitos cargados.</div>`;

function initials(name){
  if(!name) return '?';
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}

function ganttRange(p){
  const dates = [];
  if(p.fechaInicio) dates.push(p.fechaInicio);
  if(p.fechaTermino) dates.push(p.fechaTermino);
  (p.hitos||[]).forEach(h=>{ if(h.inicio) dates.push(h.inicio); if(h.fin) dates.push(h.fin); });
  if(!dates.length){ const t = todayISO(); return {start:t, end:t}; }
  dates.sort();
  return {start:dates[0], end:dates[dates.length-1]};
}

function renderGanttAxis(range){
  const {ticks} = buildTimeTicks(range.start, range.end);
  const totalDays = Math.max(1, daysBetween(range.start, range.end));
  const tickHtml = ticks.map(t=>{
    const off = Math.max(0, Math.min(99.5, (daysBetween(range.start, t.date)/totalDays)*100));
    return `<div class="gantt-axis-tick" style="left:${off}%">${t.label}</div>`;
  }).join('');
  return `<div class="gantt-row gantt-axis-row"><div class="gantt-label"></div><div class="gantt-track gantt-axis-track">${tickHtml}</div></div>`;
}

function renderGanttRow(h, range, projectId, editable){
  const total = Math.max(1, daysBetween(range.start, range.end));
  const offset = Math.max(0, daysBetween(range.start, h.inicio||range.start));
  const dur = Math.max(1, daysBetween(h.inicio||range.start, h.fin||range.end));
  const left = Math.min(100, (offset/total)*100);
  const width = Math.min(100-left, (dur/total)*100);
  const todayOffset = Math.min(100, Math.max(0, (daysBetween(range.start, todayISO())/total)*100));
  return `
  <div class="gantt-row${editable?' gantt-row-editable':''}" ${editable?`data-hito-id="${h.id}" data-project-id="${projectId}" title="Doble clic para editar las fechas de plan"`:''}>
    <div class="gantt-label" title="${esc(h.nombre)}">${esc(h.nombre)}</div>
    <div class="gantt-track">
      <div class="gantt-bar" style="left:${left}%;width:${width}%;" title="${esc(h.nombre)}: ${fmtDate(h.inicio)} → ${fmtDate(h.fin)}"></div>
      <div class="gantt-today" style="left:${todayOffset}%;" title="Hoy"></div>
    </div>
  </div>`;
}

/* ---------------- SEGUIMIENTO VIEW ---------------- */
function renderSeguimientoView(){
  const activos = STATE.projects.filter(p=>p.estado==='activo');
  const porResponsable = {};
  activos.forEach(p=>{
    const key = p.responsable || 'Sin asignar';
    if(!porResponsable[key]) porResponsable[key] = [];
    const hist = [...(p.historial||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const ultima = hist[0] ? hist[0].fecha : null;
    porResponsable[key].push({nombre:p.nombre, ultima, dias: ultima ? daysBetween(ultima, todayISO()) : null});
  });

  const rows = Object.entries(porResponsable).map(([resp, projs])=>{
    const maxDias = Math.max(...projs.map(x=>x.dias===null?9999:x.dias));
    const color = maxDias > 15 ? 'rojo' : maxDias > 7 ? 'ambar' : 'verde';
    const list = projs.map(x=> `${esc(x.nombre)} (${x.ultima ? x.dias+' d' : 'sin registro'})`).join(' · ');
    return `
    <div class="follow-row">
      <div class="follow-name">${esc(resp)}</div>
      <div class="follow-projects">${list}</div>
      <div class="follow-days"><span class="semaforo"><span class="dot ${color}"></span> ${maxDias===9999?'sin datos':maxDias+' días'}</span></div>
    </div>`;
  }).join('') || `<div class="empty">No hay responsables con proyectos activos.</div>`;

  return `
  <div class="panel">
    <div class="panel-head"><h2>Seguimiento de actualización por responsable</h2></div>
    <div class="panel-body">
      <div class="small-note" style="margin-top:0;margin-bottom:14px;">Días transcurridos desde la última actualización registrada por cada responsable en sus proyectos activos. Verde: al día (≤7 días). Amarillo: revisar (8–15 días). Rojo: atrasado (más de 15 días o sin registro).</div>
      ${rows}
    </div>
  </div>`;
}

/* ---------------- TIMELINE VIEW ---------------- */
function renderTimelineView(){
  const projects = filteredProjects().filter(p=>p.fechaInicio && p.fechaTermino);
  if(!projects.length){
    return `<div class="panel"><div class="empty">No hay proyectos con fechas para mostrar en la línea de tiempo.</div></div>`;
  }
  let minD = null, maxD = null;
  projects.forEach(p=>{
    if(!minD || p.fechaInicio < minD) minD = p.fechaInicio;
    if(!maxD || p.fechaTermino > maxD) maxD = p.fechaTermino;
  });
  // ordena por año y luego mes (fechaInicio en formato ISO ya ordena cronológicamente así)
  const sorted = [...projects].sort((a,b)=> a.fechaInicio.localeCompare(b.fechaInicio) || a.nombre.localeCompare(b.nombre));
  const totalDays = Math.max(1, daysBetween(minD, maxD));
  const {ticks} = buildTimeTicks(minD, maxD);

  const axisTicks = ticks.map(t=>{
    const off = Math.max(0, Math.min(99.5, (daysBetween(minD,t.date)/totalDays)*100));
    return `<div class="timeline-tick" style="left:${off}%">${t.label}</div>`;
  }).join('');
  const todayOffset = Math.min(100, Math.max(0, (daysBetween(minD, todayISO())/totalDays)*100));

  const rows = sorted.map(p=>{
    const offset = Math.max(0, daysBetween(minD, p.fechaInicio));
    const dur = Math.max(1, daysBetween(p.fechaInicio, p.fechaTermino));
    const left = Math.min(100, (offset/totalDays)*100);
    const width = Math.max(0.4, Math.min(100-left, (dur/totalDays)*100));
    const sem = semaforo(p);
    return `
    <div class="timeline-row" data-action="open-detail" data-id="${p.id}">
      <div class="timeline-label" title="${esc(p.nombre)}">${esc(p.nombre)}</div>
      <div class="timeline-track">
        <div class="timeline-bar ${sem}" style="left:${left}%;width:${width}%" title="${esc(p.nombre)}: ${fmtDate(p.fechaInicio)} → ${fmtDate(p.fechaTermino)}"></div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="panel">
    <div class="panel-head"><h2>Línea de tiempo de proyectos</h2></div>
    <div class="panel-body">
      <div class="timeline-wrap">
        <div class="timeline-axis-row">
          <div class="timeline-label"></div>
          <div class="timeline-track timeline-axis">${axisTicks}<div class="timeline-today" style="left:${todayOffset}%" title="Hoy"></div></div>
        </div>
        ${rows}
      </div>
    </div>
  </div>
  <div class="small-note">Ordenado por fecha de inicio (año y mes). Cada barra va de la fecha de inicio a la fecha proyectada de término, coloreada por el semáforo de avance. La línea vertical marca la fecha actual. Los nombres quedan fijos al desplazar horizontalmente; haz clic en un proyecto para ver su detalle.</div>
  `;
}

/* ---------------- EVENT HANDLING ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.dataset.action;
    if(el.tagName === 'SELECT'){
      el.onchange = (e) => handleAction(action, el, e);
    } else {
      el.onclick = (e) => { e.stopPropagation(); handleAction(action, el, e); };
    }
  });
  document.querySelectorAll('.gantt-row-editable').forEach(row=>{
    row.ondblclick = (e) => { e.stopPropagation(); openGanttQuickEdit(row.dataset.projectId, row.dataset.hitoId); };
  });
  document.querySelectorAll('.quick-add-input').forEach(inp=>{
    inp.onkeydown = (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        const btn = document.getElementById(inp.dataset.addBtn);
        if(btn) btn.click();
      }
    };
  });
  const importProjectsFile = document.getElementById('import-projects-file');
  if(importProjectsFile){
    importProjectsFile.onchange = async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      await importProjectsFromJSON(file);
      e.target.value = '';
    };
  }
}

function handleAction(action, el){
  switch(action){
    case 'go-list': STATE.view='list'; render(); break;
    case 'go-detail-any': STATE.view='detail'; render(); break;
    case 'go-seguimiento': renderSeguimientoStandalone(); break;
    case 'go-timeline': STATE.view='timeline'; render(); break;
    case 'go-equipo': STATE.view='equipo'; render(); break;
    case 'open-detail': STATE.selectedId = el.dataset.id; STATE.view='detail'; render(); break;
    case 'switch-project': STATE.selectedId = el.value; render(); break;
    case 'toggle-slide-mode': STATE.slideMode = !STATE.slideMode; render(); break;
    case 'filter-estado': STATE.filterEstado = el.value; render(); break;
    case 'filter-area': STATE.filterArea = el.value; render(); break;
    case 'filter-semaforo': STATE.filterSemaforo = el.value; render(); break;
    case 'filter-alerta': STATE.filterAlerta = el.value; render(); break;
    case 'open-new': openProjectModal(null); break;
    case 'open-edit': openProjectModal(getProject(el.dataset.id)); break;
    case 'open-update': openUpdateModal(getProject(el.dataset.id)); break;
    case 'archive': setEstado(el.dataset.id, 'archivado'); break;
    case 'unarchive': setEstado(el.dataset.id, 'activo'); break;
    case 'login': {
      const sel = document.getElementById('login-select');
      const pwd = document.getElementById('login-password');
      if(sel && sel.value) doLogin(sel.value, pwd ? pwd.value : '');
      break;
    }
    case 'login-select-change': STATE.loginSelected = el.value; STATE.loginError=''; render(); break;
    case 'logout': doLogout(); break;
    case 'sync-now': pollForUpdates(); break;
    case 'add-person': addPerson(); break;
    case 'remove-person': removePerson(Number(el.dataset.idx)); break;
    case 'add-area': addArea(); break;
    case 'reset-seed-data': resetToSeedData(); break;
    case 'import-projects-btn': { const f = document.getElementById('import-projects-file'); if(f) f.click(); break; }
    case 'quick-edit-etapa': {
      const p = getProject(el.dataset.id); if(!p || !canUpdate(p)) break;
      openQuickEdit(p.id, 'Cambiar etapa', [
        {key:'etapa', label:'Etapa actual', type:'select', value:p.etapa||'Estudio', options: ETAPAS.map(e=>({value:e,label:e}))}
      ], async (vals, proj) => {
        proj.etapa = vals.etapa;
        logCambio(proj, `Cambió la etapa a ${vals.etapa}`);
        await saveData();
      });
      break;
    }
    case 'quick-edit-avance': {
      const p = getProject(el.dataset.id); if(!p || !canUpdate(p)) break;
      openQuickEdit(p.id, 'Actualizar avance', [
        {key:'avanceReal', label:'% avance real (de la etapa)', type:'number', value:p.avanceReal||0, min:0, max:100},
        {key:'avancePlan', label:'% avance plan (de la etapa)', type:'number', value:p.avancePlan||0, min:0, max:100}
      ], async (vals, proj) => {
        proj.avanceReal = Math.max(0, Math.min(100, Number(vals.avanceReal)||0));
        proj.avancePlan = Math.max(0, Math.min(100, Number(vals.avancePlan)||0));
        logCambio(proj, `Actualizó avance a ${proj.avanceReal}% real / ${proj.avancePlan}% plan`);
        await saveData();
      });
      break;
    }
    case 'quick-edit-alerta': {
      const p = getProject(el.dataset.id); if(!p || !canUpdate(p)) break;
      const alerta = p.alerta || {color:'verde', comentario:''};
      openQuickEdit(p.id, 'Cambiar alerta', [
        {key:'color', label:'Color de alerta', type:'select', value:alerta.color, options:[
          {value:'verde', label:'Verde — sin nada que relevar'},
          {value:'ambar', label:'Amarillo — a monitorear'},
          {value:'rojo', label:'Rojo — relevar en reunión'}
        ]},
        {key:'comentario', label:'Comentario (visible en el listado)', type:'textarea', value:alerta.comentario||''}
      ], async (vals, proj) => {
        proj.alerta = {color:vals.color, comentario:(vals.comentario||'').trim()};
        logCambio(proj, `Cambió la alerta a ${vals.color}`);
        await saveData();
      });
      break;
    }
    case 'quick-edit-presupuesto': {
      const p = getProject(el.dataset.id); if(!p || !canUpdate(p)) break;
      const fields = [{key:'ejecutado', label:'Ejecutado ($)', type:'number', value:p.ejecutado||0, min:0}];
      if(canFullEdit(p)) fields.unshift({key:'presupuesto', label:'Presupuestado ($)', type:'number', value:p.presupuesto||0, min:0});
      openQuickEdit(p.id, 'Actualizar presupuesto', fields, async (vals, proj) => {
        if(vals.presupuesto != null) proj.presupuesto = Math.max(0, Number(vals.presupuesto)||0);
        proj.ejecutado = Math.max(0, Number(vals.ejecutado)||0);
        logCambio(proj, `Actualizó presupuesto ejecutado a ${fmtMoney(proj.ejecutado)}`);
        await saveData();
      });
      break;
    }
    case 'quick-add-item': {
      const p = getProject(el.dataset.id); if(!p || !canUpdate(p)) break;
      const listKey = el.dataset.list;
      const input = document.getElementById('qadd-'+listKey);
      if(!input) break;
      const texto = input.value.trim();
      if(!texto) break;
      p[listKey] = p[listKey] || [];
      if(listKey === 'riesgos'){
        const nivelSel = document.getElementById('qadd-riesgos-nivel');
        p[listKey].push({id:uid('r'), descripcion:texto, nivel: nivelSel ? nivelSel.value : 'medio'});
      } else {
        p[listKey].push({id:uid('x'), descripcion:texto});
      }
      logCambio(p, `Agregó un ítem a ${listKey}: "${texto}"`);
      saveData().then(render);
      break;
    }
    case 'quick-del-item': {
      const p = getProject(el.dataset.id); if(!p || !canUpdate(p)) break;
      const listKey = el.dataset.list;
      const idx = Number(el.dataset.idx);
      if(!p[listKey] || !p[listKey][idx]) break;
      p[listKey].splice(idx,1);
      saveData().then(render);
      break;
    }
    case 'remove-area': removeArea(Number(el.dataset.idx)); break;
    case 'add-sesion': addCategoryItem('sesiones', 'ns-nombre', saveSesiones); break;
    case 'remove-sesion': removeCategoryItem('sesiones', Number(el.dataset.idx), 'sesion', saveSesiones); break;
    case 'add-tipo': addCategoryItem('tipos', 'nt-nombre', saveTipos); break;
    case 'remove-tipo': removeCategoryItem('tipos', Number(el.dataset.idx), 'tipoProyecto', saveTipos); break;
    case 'add-kpi': addCategoryItem('kpiDrivers', 'nk-nombre', saveKpiDrivers); break;
    case 'remove-kpi': removeCategoryItem('kpiDrivers', Number(el.dataset.idx), 'kpiDriver', saveKpiDrivers); break;
    case 'export-pptx': openExportModal(); break;
    case 'open-lightbox': { const p = getProject(el.dataset.id); if(p && p.imagen) showLightbox(p.imagen, p.nombre); break; }
    case 'photo-quick-upload': quickUploadPhoto(el.dataset.id); break;
  }
}

function quickUploadPhoto(projectId){
  const p = getProject(projectId);
  if(!p || !canUpdate(p)) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await compressImage(file);
      p.imagen = dataUrl;
      p.historial = p.historial || [];
      p.historial.push({id:uid('l'), fecha:todayISO(), usuario:STATE.currentUser.nombre, cambio:'Actualizó la foto del proyecto'});
      await saveData();
      render();
    }catch(err){
      console.error(err);
      alert('No se pudo procesar la imagen. Prueba con otro archivo.');
    }
  };
  input.click();
}

async function addArea(){
  if(!isExcelencia()) return;
  const input = document.getElementById('na-nombre');
  const nombre = input.value.trim();
  if(!nombre) return;
  if(STATE.areas.some(a=>a.toLowerCase()===nombre.toLowerCase())) return;
  STATE.areas.push(nombre);
  await saveAreas();
  render();
}

async function removeArea(idx){
  if(!isExcelencia()) return;
  const area = STATE.areas[idx];
  if(!area) return;
  const enUso = STATE.projects.some(p=>p.area===area) || STATE.directorio.some(d=>d.area===area);
  if(enUso){
    alert('No se puede quitar "'+area+'": todavía hay proyectos o personas asignadas a esta área. Reasígnalos primero.');
    return;
  }
  STATE.areas.splice(idx,1);
  await saveAreas();
  render();
}

async function addCategoryItem(stateKey, inputId, saveFn){
  if(!isExcelencia()) return;
  const input = document.getElementById(inputId);
  if(!input) return;
  const nombre = input.value.trim();
  if(!nombre) return;
  if(STATE[stateKey].some(v=>v.toLowerCase()===nombre.toLowerCase())) return;
  STATE[stateKey].push(nombre);
  await saveFn();
  render();
}

async function removeCategoryItem(stateKey, idx, projectFieldKey, saveFn){
  if(!isExcelencia()) return;
  const valor = STATE[stateKey][idx];
  if(!valor) return;
  const enUso = STATE.projects.some(p=>p[projectFieldKey]===valor);
  if(enUso){
    alert('No se puede quitar "'+valor+'": todavía hay proyectos que lo tienen asignado. Reasígnalos primero desde "Editar ficha".');
    return;
  }
  STATE[stateKey].splice(idx,1);
  await saveFn();
  render();
}

async function resetToSeedData(){
  if(!isExcelencia()) return;
  const primeraConf = confirm('Esto reemplazará TODOS los proyectos actuales por los 20 datos originales de la presentación. Se perderá cualquier edición, foto, highlight, lowlight o riesgo agregado desde entonces. ¿Continuar?');
  if(!primeraConf) return;
  const segundaConf = confirm('Confirmación final: esta acción no se puede deshacer. ¿Restablecer de todas formas?');
  if(!segundaConf) return;
  try{ await fbDeleteAllProjects(); }catch(e){ console.error('Error limpiando proyectos previos:', e); }
  STATE.projects = seedData();
  await saveData();
  STATE.view = 'list';
  render();
}

async function importProjectsFromJSON(file){
  if(!isExcelencia()) return;
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){
    alert('No se pudo leer el archivo. Verificá que sea un JSON válido.');
    return;
  }
  if(!Array.isArray(data)){
    alert('El archivo debe contener una lista (array) de proyectos, entre corchetes [ ].');
    return;
  }
  let importados = 0, omitidos = 0;
  for(const raw of data){
    if(!raw || !raw.nombre || !String(raw.nombre).trim()){ omitidos++; continue; }
    const p = {
      id: uid('proj'),
      numero: getNextNumero(),
      nombre: String(raw.nombre).trim(),
      area: (raw.area && STATE.areas.includes(raw.area)) ? raw.area : STATE.areas[0],
      responsable: raw.responsable ? String(raw.responsable) : '',
      etapa: ETAPAS.includes(raw.etapa) ? raw.etapa : 'Estudio',
      fechaRequerimiento: raw.fechaRequerimiento || todayISO(),
      fechaInicio: raw.fechaInicio || todayISO(),
      fechaTermino: raw.fechaTermino || todayISO(),
      avanceReal: Math.max(0, Math.min(100, Number(raw.avanceReal)||0)),
      avancePlan: Math.max(0, Math.min(100, Number(raw.avancePlan)||0)),
      estado: raw.estado === 'archivado' ? 'archivado' : 'activo',
      presupuesto: Number(raw.presupuesto)||0,
      ejecutado: Number(raw.ejecutado)||0,
      alerta: (raw.alerta && ['verde','ambar','rojo'].includes(raw.alerta.color)) ? {color:raw.alerta.color, comentario:raw.alerta.comentario||''} : {color:'verde', comentario:''},
      imagen: null,
      sesion: (raw.sesion && STATE.sesiones.includes(raw.sesion)) ? raw.sesion : null,
      tipoProyecto: (raw.tipoProyecto && STATE.tipos.includes(raw.tipoProyecto)) ? raw.tipoProyecto : null,
      kpiDriver: (raw.kpiDriver && STATE.kpiDrivers.includes(raw.kpiDriver)) ? raw.kpiDriver : null,
      hitos: Array.isArray(raw.hitos) ? raw.hitos.filter(h=>h && h.nombre).map(h=>({id:uid('h'), nombre:String(h.nombre), inicio:h.inicio||todayISO(), fin:h.fin||todayISO()})) : [],
      riesgos: Array.isArray(raw.riesgos) ? raw.riesgos.filter(r=>r && r.descripcion).map(r=>({id:uid('r'), descripcion:String(r.descripcion), nivel:['bajo','medio','alto'].includes(r.nivel)?r.nivel:'medio'})) : [],
      apoyos: Array.isArray(raw.apoyos) ? raw.apoyos.filter(a=>a && a.descripcion).map(a=>({id:uid('a'), descripcion:String(a.descripcion)})) : [],
      highlights: Array.isArray(raw.highlights) ? raw.highlights.filter(x=>x && x.descripcion).map(x=>({id:uid('hi'), descripcion:String(x.descripcion)})) : [],
      lowlights: Array.isArray(raw.lowlights) ? raw.lowlights.filter(x=>x && x.descripcion).map(x=>({id:uid('lo'), descripcion:String(x.descripcion)})) : [],
      historial: [{id:uid('l'), fecha:todayISO(), usuario:STATE.currentUser.nombre, cambio:'Proyecto importado desde archivo JSON'}]
    };
    STATE.projects.push(p);
    importados++;
  }
  if(importados > 0){
    await saveData();
  }
  render();
  alert(`Importación terminada: ${importados} proyecto(s) agregado(s)` + (omitidos ? `, ${omitidos} omitido(s) por no tener nombre.` : '.'));
}

async function addPerson(){
  if(!isExcelencia()) return;
  const nombre = document.getElementById('np-nombre').value.trim();
  const area = document.getElementById('np-area').value;
  const rol = document.getElementById('np-rol').value;
  if(!nombre) return;
  if(STATE.directorio.some(d=>d.nombre.toLowerCase()===nombre.toLowerCase())) return;
  STATE.directorio.push({nombre, area, rol});
  await saveDirectorio();
  render();
}

async function removePerson(idx){

  const entry = STATE.directorio[idx];

  if(STATE.currentUser && STATE.currentUser.nombre === entry.nombre) return;
  STATE.directorio.splice(idx,1);
  await saveDirectorio();
  render();
}

function openModalShell(title, bodyHtml, onMount){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="btn ghost sm" data-close>Cerrar</button></div>
      <div class="modal-body">${bodyHtml}</div>
    </div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
  overlay.querySelector('[data-close]').onclick = () => overlay.remove();
  document.body.appendChild(overlay);
  if(onMount) onMount(overlay);
  return overlay;
}

function openQuickEdit(projectId, title, fields, onSave){
  const p = getProject(projectId);
  if(!p) return;
  const fieldsHtml = fields.map(f=>{
    if(f.type==='select'){
      return `<div class="field" style="margin-bottom:12px;"><label>${esc(f.label)}</label><select id="qe-${f.key}">${f.options.map(o=>`<option value="${esc(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
    }
    if(f.type==='textarea'){
      return `<div class="field" style="margin-bottom:12px;"><label>${esc(f.label)}</label><textarea id="qe-${f.key}" rows="2">${esc(f.value||'')}</textarea></div>`;
    }
    return `<div class="field" style="margin-bottom:12px;"><label>${esc(f.label)}</label><input type="${f.type||'text'}" id="qe-${f.key}" value="${f.value!=null?esc(String(f.value)):''}" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''}></div>`;
  }).join('');
  const body = fieldsHtml + `
    <div class="modal-foot" style="padding:18px 0 0;border-top:none;">
      <button class="btn" type="button" id="qe-cancel">Cancelar</button>
      <button class="btn primary" type="button" id="qe-save">Guardar</button>
    </div>`;
  const ov = openModalShell(title, body, (ov)=>{
    ov.querySelector('#qe-cancel').onclick = () => ov.remove();
    ov.querySelector('#qe-save').onclick = async () => {
      const values = {};
      fields.forEach(f=>{ values[f.key] = ov.querySelector('#qe-'+f.key).value; });
      await onSave(values, p);
      ov.remove();
      render();
    };
  });
}

      p.lowlights = lowlights.filter(x=>x.descripcion.trim());
      p.historial = p.historial || [];
      p.historial.push({
        id: uid('l'), fecha, usuario,
        cambio: (comentario ? comentario + ' — ' : '') + `Etapa: ${nuevaEtapa}. Avance actualizado a ${nuevoAvance}%, alerta en ${nuevoAlertaColor}`
      });
      await saveData();
      ov.remove();
      render();
    };
  });
}

function compressImage(file, maxW=900, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

function showLightbox(url, caption){
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${url}">${caption?`<div class="lightbox-caption">${esc(caption)}</div>`:''}`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

/* ---------------- IMPORT HITOS FROM EXCEL / CSV ---------------- */
const XLSX_LIB_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';

function loadXlsxLib(){
  return new Promise((resolve, reject)=>{
    if(window.XLSX){ resolve(); return; }
    const s = document.createElement('script');
    s.src = XLSX_LIB_URL;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('No se pudo cargar la librería de importación'));
    document.head.appendChild(s);
  });
}

function parseFlexibleDate(v){
  if(v == null || v === '') return null;
  if(v instanceof Date && !isNaN(v)){
    return v.toISOString().slice(0,10);
  }
  if(typeof v === 'number'){
    // Excel serial date
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})$/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = '20'+y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return null;
}

function findCol(row, patterns){
  const keys = Object.keys(row);
  for(const p of patterns){
    const found = keys.find(k => p.test(k));
    if(found) return found;
  }
  return null;
}

async function importHitosFromFile(file){
  await loadXlsxLib();
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array', cellDates:true});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = window.XLSX.utils.sheet_to_json(sheet, {defval:''});
  const result = [];
  for(const row of rows){
    const colNombre = findCol(row, [/^actividad$/i, /^hito$/i, /^nombre$/i, /^tarea$/i]);
    const colInicio = findCol(row, [/inicio/i, /desde/i, /start/i, /^fecha ?inicio$/i]);
    const colFin = findCol(row, [/^fin$/i, /t[ée]rmino/i, /hasta/i, /^end$/i]);
    const nombre = colNombre ? String(row[colNombre]).trim() : '';
    if(!nombre) continue;
    const inicio = colInicio ? parseFlexibleDate(row[colInicio]) : null;
    const fin = colFin ? parseFlexibleDate(row[colFin]) : null;
    if(!inicio || !fin) continue;
    result.push({ id: uid('h'), nombre, inicio, fin });
  }
  return result;
}

const PPTX_LIB_URL = 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
const PC = { verde:'1F8A4C', verdeTint:'E5F5EB', ambar:'B87A12', ambarTint:'FCF1DE', rojo:'C23B34', rojoTint:'FBE9E7', ink:'1B2430', soft:'5B6472', faint:'8992A0', line:'E1E4E9', bg:'F3F4F6', white:'FFFFFF' };
const PPTX_THEMES = {

  grafito:  { label:'Grafito',  hex:'33414F' },

function loadPptxLib(){

function semLabel(color){ return color==='verde' ? 'Verde' : color==='ambar' ? 'Amarillo' : 'Rojo'; }
function semHex(color){ return color==='verde' ? PC.verde : color==='ambar' ? PC.ambar : PC.rojo; }

async function exportToPPTX(options, btnEl){
  const original = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = 'Generando…'; btnEl.disabled = true; }
  try{
    await loadPptxLib();
    const projects = filteredProjects();
    if(!projects.length){ alert('No hay proyectos que coincidan con los filtros actuales para exportar.'); return; }

    const accent = (PPTX_THEMES[options.tema] || PPTX_THEMES.marino).hex;
    const titulo = options.titulo || 'Control de proyectos';
    const subtitulo = options.subtitulo || '';

    const pptx = new window.PptxGenJS();
    pptx.defineLayout({ name:'WIDE', width:13.33, height:7.5 });
    pptx.layout = 'WIDE';

    /* Slide de portada */
    if(options.portada){
      let cover = pptx.addSlide();
      cover.background = { color: PC.white };
      cover.addShape('rect', { x:0, y:0, w:13.33, h:0.12, fill:{color:accent} });
      cover.addShape('rect', { x:0, y:2.7, w:1.1, h:0.06, fill:{color:accent} });
      cover.addText(titulo, { x:0.6, y:2.85, w:12, h:0.9, fontSize:34, bold:true, color:PC.ink, fontFace:'Arial' });
      if(subtitulo) cover.addText(subtitulo, { x:0.6, y:3.7, w:12, h:0.5, fontSize:16, color:PC.soft, fontFace:'Arial' });
      cover.addText(`Generado el ${fmtDate(todayISO())}  ·  ${projects.length} proyecto(s) incluidos`, { x:0.6, y:4.2, w:12, h:0.4, fontSize:11.5, color:PC.faint, fontFace:'Arial' });
    }

    /* Slide(s) de listado */
    const perSlide = 9;
    const totalChunks = Math.ceil(projects.length / perSlide);
    for(let c=0; c<totalChunks; c++){
      const chunk = projects.slice(c*perSlide, c*perSlide+perSlide);
      const sl = pptx.addSlide();
      addHeaderBand(sl, accent, 'Listado de proyectos' + (totalChunks>1 ? `  ·  parte ${c+1} de ${totalChunks}` : ''));

      const headerOpts = { bold:true, color:PC.white, fill:{color:accent}, fontSize:9.5, fontFace:'Arial', valign:'middle' };
      const rows = [[
        {text:'N°', options:headerOpts}, {text:'Proyecto', options:headerOpts}, {text:'Área', options:headerOpts}, {text:'Responsable', options:headerOpts},
        {text:'Requerim.', options:headerOpts}, {text:'Término', options:headerOpts}, {text:'Avance', options:headerOpts},
        {text:'Brecha', options:headerOpts}, {text:'Est.', options:headerOpts}, {text:'Alerta', options:headerOpts}
      ]];
      chunk.forEach((p,ri)=>{
        const brecha = (p.avanceReal||0) - (p.avancePlan||0);
        const band = ri % 2 === 1 ? PC.bg : PC.white;
        rows.push([
          {text:p.numero!=null?String(p.numero):'—', options:{fontSize:9, fontFace:'Arial', color:PC.faint, fill:{color:band}}},
          {text:p.nombre, options:{fontSize:9.5, fontFace:'Arial', color:PC.ink, fill:{color:band}}},
          {text:p.area, options:{fontSize:9, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
          {text:p.responsable||'—', options:{fontSize:9, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
          {text:fmtDate(p.fechaRequerimiento), options:{fontSize:8.5, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
          {text:fmtDate(p.fechaTermino), options:{fontSize:8.5, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
          {text:`${p.avanceReal||0}% / ${p.avancePlan||0}%`, options:{fontSize:9, fontFace:'Arial', color:PC.ink, fill:{color:band}}},
          {text:fmtBrecha(brecha), options:{fontSize:9, fontFace:'Arial', color: brecha>=0?PC.verde:PC.rojo, bold:true, fill:{color:band}}},
          {text:' ', options:{fill:{color:semHex(semaforo(p))}}},
          {text:' ', options:{fill:{color:semHex(alertaColor(p))}}}
        ]);
      });
      sl.addTable(rows, {
        x:0.45, y:1.15, w:12.45,
        colW:[0.4,2.85,1.2,1.4,1.0,1.0,1.1,0.8,0.65,0.65],
        border:{type:'solid', color:PC.line, pt:0.5},
        autoPage:false, rowH:0.36, valign:'middle'
      });
      sl.addText('Columna "Est." = semáforo de avance según brecha real vs plan  ·  "Alerta" = definida por el dueño del proyecto para relevar en reunión', { x:0.45, y:1.15+0.36*(rows.length)+0.12, w:12.45, h:0.3, fontSize:8.5, italic:true, color:PC.faint, fontFace:'Arial' });
      addFooter(sl, accent, titulo);
    }

    /* Una lámina por proyecto */
    projects.forEach(p => addProjectSlide(pptx, p, accent, titulo));

    await pptx.writeFile({ fileName: (titulo || 'control-proyectos').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.pptx' });
  }catch(err){
    console.error(err);
    alert('No se pudo generar la presentación. Verifica tu conexión e inténtalo de nuevo.');
  }finally{
    if(btnEl){ btnEl.textContent = original; btnEl.disabled = false; }
  }
}

function addHeaderBand(sl, accent, title){
  sl.addShape('rect', { x:0, y:0, w:13.33, h:0.82, fill:{color:accent} });
  sl.addText(title, { x:0.45, y:0.12, w:12.4, h:0.58, fontSize:19, bold:true, color:PC.white, fontFace:'Arial', valign:'middle' });
}

function addFooter(sl, accent, titulo){
  sl.addShape('rect', { x:0, y:7.28, w:13.33, h:0.02, fill:{color:PC.line} });
  sl.addText(titulo, { x:0.45, y:7.32, w:8, h:0.25, fontSize:8, color:PC.faint, fontFace:'Arial' });
  sl.addText(fmtDate(todayISO()), { x:10.5, y:7.32, w:2.4, h:0.25, fontSize:8, color:PC.faint, fontFace:'Arial', align:'right' });
}

function addStatusChip(sl, x, y, w, label, color){
  sl.addShape('roundRect', { x, y, w, h:0.34, fill:{color}, rectRadius:0.06, line:{type:'none'} });
  sl.addText(label, { x, y, w, h:0.34, fontSize:10.5, bold:true, color:PC.white, align:'center', valign:'middle', fontFace:'Arial' });
}

function addProjectSlide(pptx, p, accent, titulo){
  const sl = pptx.addSlide();
  const sem = semaforo(p), al = alertaColor(p);
  const brecha = (p.avanceReal||0) - (p.avancePlan||0);

  sl.addShape('rect', { x:0, y:0, w:13.33, h:1.05, fill:{color:accent} });
  sl.addText((p.numero!=null?'N°'+p.numero+' — ':'')+p.nombre, { x:0.45, y:0.14, w:9.7, h:0.55, fontSize:21, bold:true, color:PC.white, fontFace:'Arial' });
  sl.addText(`${p.responsable||'sin responsable'}  ·  Etapa: ${p.etapa||'—'}  ·  ${p.estado==='activo'?'Activo':'Archivado'}`, { x:0.45, y:0.66, w:9.7, h:0.32, fontSize:11, color:'D7DEE8', fontFace:'Arial' });

  addStatusChip(sl, 10.35, 0.2, 2.55, `AVANCE ${semLabel(sem).toUpperCase()}`, semHex(sem));
  addStatusChip(sl, 10.35, 0.6, 2.55, `ALERTA ${semLabel(al).toUpperCase()}`, semHex(al));

  sl.addText([
    { text:'Avance real: ', options:{bold:true, color:PC.soft} },
    { text:`${p.avanceReal||0}%    `, options:{color:PC.ink, bold:true} },
    { text:'Avance plan: ', options:{bold:true, color:PC.soft} },
    { text:`${p.avancePlan||0}%    `, options:{color:PC.ink} },
    { text:'Brecha: ', options:{bold:true, color:PC.soft} },
    { text:fmtBrecha(brecha), options:{color: brecha>=0?PC.verde:PC.rojo, bold:true} }
  ], { x:0.45, y:1.22, w:8.5, h:0.32, fontSize:11.5, fontFace:'Arial' });

  sl.addText([
    { text:'Requerimiento: ', options:{bold:true, color:PC.soft} },
    { text:fmtDate(p.fechaRequerimiento)+'    ', options:{color:PC.ink} },
    { text:'Término proyectado: ', options:{bold:true, color:PC.soft} },
    { text:fmtDate(p.fechaTermino), options:{color:PC.ink} }
  ], { x:0.45, y:1.55, w:9.7, h:0.3, fontSize:10.5, fontFace:'Arial' });

  let topY = 1.95;
  if(al !== 'verde' && p.alerta && p.alerta.comentario){
    sl.addShape('roundRect', { x:0.45, y:topY, w:12.45, h:0.55, fill:{color: al==='rojo' ? PC.rojoTint : PC.ambarTint}, rectRadius:0.04, line:{color:semHex(al), width:0.75} });
    sl.addText(`Para relevar en reunión:  ${p.alerta.comentario}`, { x:0.65, y:topY+0.03, w:12.1, h:0.49, fontSize:10, color:PC.ink, fontFace:'Arial', valign:'middle' });
    topY += 0.7;
  }

  /* columna izquierda: hitos + riesgos */
  sl.addText('CARTA GANTT (PLAN)', { x:0.45, y:topY, w:7.55, h:0.28, fontSize:11, bold:true, color:accent, fontFace:'Arial', charSpacing:1 });
  const hitos = (p.hitos||[]).slice(0,9);
  let afterHitosY = topY + 0.33;
  if(hitos.length){
    const hRows = [[
      {text:'Actividad', options:{bold:true, color:PC.white, fill:{color:accent}, fontSize:8.5}},
      {text:'Inicio', options:{bold:true, color:PC.white, fill:{color:accent}, fontSize:8.5}},
      {text:'Fin', options:{bold:true, color:PC.white, fill:{color:accent}, fontSize:8.5}}
    ]];
    hitos.forEach((h,ri)=>{
      const band = ri % 2 === 1 ? PC.bg : PC.white;
      hRows.push([
        {text:h.nombre, options:{fontSize:9, fontFace:'Arial', color:PC.ink, fill:{color:band}}},
        {text:fmtDate(h.inicio), options:{fontSize:8, fontFace:'Arial', color:PC.soft, fill:{color:band}}},
        {text:fmtDate(h.fin), options:{fontSize:8, fontFace:'Arial', color:PC.soft, fill:{color:band}}}
      ]);
    });
    sl.addTable(hRows, { x:0.45, y:afterHitosY, w:7.55, colW:[4.85,1.35,1.35], border:{type:'solid', color:PC.line, pt:0.5}, rowH:0.24, autoPage:false, valign:'middle' });
    afterHitosY += 0.24 * hRows.length;
    if((p.hitos||[]).length > 9){
      sl.addText(`+ ${p.hitos.length-9} actividad(es) adicionales — ver detalle en la app`, { x:0.45, y:afterHitosY+0.04, w:7.55, h:0.22, fontSize:8, italic:true, color:PC.faint, fontFace:'Arial' });
      afterHitosY += 0.24;
    }
  } else {
    sl.addText('Sin hitos cargados.', { x:0.45, y:afterHitosY, w:7.55, h:0.28, fontSize:9.5, color:PC.faint, italic:true, fontFace:'Arial' });
    afterHitosY += 0.3;
  }

  const riesgosY = afterHitosY + 0.28;
  sl.addText('PRINCIPALES RIESGOS', { x:0.45, y:riesgosY, w:7.55, h:0.28, fontSize:11, bold:true, color:accent, fontFace:'Arial', charSpacing:1 });
  const riesgos = (p.riesgos||[]).slice(0,5);
  if(riesgos.length){
    sl.addText(riesgos.map(r => ({
      text: `${r.descripcion}  (${r.nivel})`,
      options: { bullet:{code:'25CF'}, fontSize:9.5, color: r.nivel==='alto'?PC.rojo:r.nivel==='medio'?PC.ambar:PC.verde, fontFace:'Arial', breakLine:true }
    })), { x:0.45, y:riesgosY+0.32, w:7.55, h:1.5 });
  } else {
    sl.addText('Sin riesgos registrados.', { x:0.45, y:riesgosY+0.32, w:7.55, h:0.28, fontSize:9.5, color:PC.faint, italic:true, fontFace:'Arial' });
  }

  /* columna derecha: presupuesto + apoyos */
  const rightX = 8.35, rightW = 4.55;
  sl.addText('PRESUPUESTO', { x:rightX, y:topY, w:rightW, h:0.28, fontSize:11, bold:true, color:accent, fontFace:'Arial', charSpacing:1 });
  const pctEjec = p.presupuesto ? Math.min(100, Math.round((p.ejecutado||0)/p.presupuesto*100)) : 0;
  sl.addShape('roundRect', { x:rightX, y:topY+0.38, w:rightW, h:0.2, fill:{color:PC.bg}, rectRadius:0.1, line:{type:'none'} });
  if(pctEjec>0) sl.addShape('roundRect', { x:rightX, y:topY+0.38, w:rightW*(pctEjec/100), h:0.2, fill:{color:accent}, rectRadius:0.1, line:{type:'none'} });
  sl.addText(`Ejecutado: ${fmtMoney(p.ejecutado)}  (${pctEjec}%)`, { x:rightX, y:topY+0.63, w:rightW, h:0.24, fontSize:9.5, color:PC.ink, fontFace:'Arial' });
  sl.addText(`Presupuestado: ${fmtMoney(p.presupuesto)}`, { x:rightX, y:topY+0.87, w:rightW, h:0.24, fontSize:9.5, color:PC.soft, fontFace:'Arial' });

  sl.addText('REQUERIMIENTOS DE APOYO', { x:rightX, y:topY+1.35, w:rightW, h:0.28, fontSize:11, bold:true, color:accent, fontFace:'Arial', charSpacing:1 });
  const apoyos = (p.apoyos||[]).slice(0,5);
  if(apoyos.length){
    sl.addText(apoyos.map(a => ({ text:a.descripcion, options:{ bullet:{code:'25CF'}, fontSize:9.5, color:PC.ink, fontFace:'Arial', breakLine:true } })), { x:rightX, y:topY+1.67, w:rightW, h:1.5 });
  } else {
    sl.addText('Sin requerimientos registrados.', { x:rightX, y:topY+1.67, w:rightW, h:0.28, fontSize:9.5, color:PC.faint, italic:true, fontFace:'Arial' });
  }

  addFooter(sl, accent, titulo);
}
